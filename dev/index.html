<!doctype html>
<html lang="ar" dir="rtl">
  <head>

  <!-- ===== الترميز والعرض الأساسي (تقني - مايتغيرش) ===== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
 
  <!-- ===== العنوان والوصف (SEO) ===== -->
  <title>[عنوان الصفحة]</title>
  <meta name="description" content="[وصف الصفحة]">
  <meta name="keywords" content="[قائمة كلمات مفتاحية مفصولة بفاصلة، مرتبطة بمجال التخسيس والتدريب الأونلاين وأهم مصطلحات يبحث عنها الجمهور المستهدف]">
  <meta name="author" content="[الاسم الكامل للمدرب]">
  <meta name="robots" content="index, follow">
  <meta name="language" content="ar">
 
  <!-- ===== الرابط الأساسي (Canonical) ===== -->
  <link rel="canonical" href="https://capomarraafat.pages.dev/">
 
  <!-- ===== لون شريط المتصفح (يطابق --color-bg في variables.css) ===== -->
  <meta name="theme-color" content="#16140F">
  <meta name="color-scheme" content="dark">
 
  <!-- ===== الأيقونات (Favicons) — مسارات ملفات، مش محتوى نصي ===== -->
  <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/svg+xml" href="/src/assets/icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
 
  <!-- ===== Open Graph (فيسبوك / واتساب / لينكدإن) ===== -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="[اسم البراند]">
  <meta property="og:locale" content="[كود اللغة والدولة، مثال: ar_EG]">
  <meta property="og:title" content="[عنوان جذّاب مختصر يُستخدم عند مشاركة الرابط — ممكن يكون الـ Tagline الأساسي للبراند]">
  <meta property="og:description" content="[وصف قصير ومحفّز يظهر تحت العنوان عند مشاركة الرابط في السوشيال ميديا]">
  <meta property="og:image" content="[رابط صورة المشاركة الاجتماعية، مقاس 1200×630px]">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="[وصف نصي بديل لصورة المشاركة لأغراض الوصول (Accessibility)]">
  <meta property="og:url" content="https://capomarraafat.pages.dev/">
 
  <!-- ===== Twitter Card ===== -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="[نفس عنوان الـ Open Graph أو نسخة مختصرة منه]">
  <meta name="twitter:description" content="[نفس وصف الـ Open Graph أو نسخة مختصرة منه]">
  <meta name="twitter:image" content="[نفس رابط صورة الـ Open Graph]">


  </head>
  <body>
<!-- Header -->
<header class="header">
  <div class="header__inner">
    <div class="header__logo">
      <a href="#" aria-label="العودة للصفحة الرئيسية">
        <span class="header__logo-text">[اسم البراند]</span>
      </a>
    </div>

    <div class="header__nav-wrapper">
      <nav class="header__nav" aria-label="القائمة الرئيسية">
        <ul class="header__nav-list">
          <li class="header__nav-item"><a href="#hero" class="header__nav-link">الرئيسية</a></li>
          <li class="header__nav-item"><a href="#howitwork" class="header__nav-link">كيف يعمل</a></li>
          <li class="header__nav-item"><a href="#results" class="header__nav-link">النتائج</a></li>
          <li class="header__nav-item"><a href="#pricing" class="header__nav-link">الأسعار</a></li>
          <li class="header__nav-item"><a href="#about" class="header__nav-link">عن المدرب</a></li>
          <li class="header__nav-item"><a href="#faq" class="header__nav-link">الأسئلة الشائعة</a></li>
        </ul>
      </nav>
    </div>

    <div class="header__actions">
      <button class="header__lang-toggle">
        <svg aria-hidden="true" class="header__lang-icon icon">
          <use href="/sprites/solid.svg#globe"></use>
        </svg>
        <div class="header__lang-texts">
          <span class="header__lang-text header__lang-text--active">AR</span>
          <span class="header__lang-text">EN</span>
        </div>
      </button>

      <div class="header__cta-wrapper">
        <a href="#pricing" class="header__cta">[CTA Text]</a>
      </div>
    </div>

    <div class="header__hamburger">
      <button
        type="button"
        class="header__hamburger-toggle"
        aria-label="فتح القائمة الجانبية"
        aria-expanded="false"
        aria-controls="sideMenu"
      >
        <svg aria-hidden="true" class="header__hamburger-icon icon">
          <use href="/sprites/solid.svg#bars"></use>
        </svg>
      </button>
    </div>
  </div>
</header>

    <main id="main-content">
    <!-- hero -->
      <section id="hero">
      </section>
    <!-- Problem -->
      <section id="problem">
      </section>
    <!-- Offer -->
      <section id="offer">
      </section>
    <!-- How -->
      <section id="howitwork">
      </section>
    <!-- Results -->
      <section id="results">
      </section>
    <!-- Pricing -->
      <section id="pricing">
      </section>
    <!-- About -->
      <section id="about">
      </section>
    <!-- FAQ -->
      <section id="faq">
      </section>
    </main>
    
    <!-- Footer -->
    <footer id="main-footer">

    </footer>

    <div class="floating-actions">
  <button type="button"
          class="floating-toggle"
          aria-label="فتح خيارات التواصل"
          aria-expanded="false"
          aria-controls="floatingActionsMenu">
    <!-- أيقونة -->
  </button>

  <div class="floating-actions-menu" id="floatingActionsMenu" hidden>

    <ul class="floating-actions-top">
      <li>
        <a href="https://wa.me/20XXXXXXXXXX"
           target="_blank" rel="noopener noreferrer"
           class="floating-action whatsapp-action"
           aria-label="تواصل عبر واتساب">
          <!-- أيقونة واتساب -->
        </a>
      </li>
      <li>
        <button type="button"
                class="floating-action social-action"
                aria-haspopup="true"
                aria-controls="socialPanel"
                aria-expanded="false"
                aria-label="عرض جميع حسابات التواصل الاجتماعي">
          <!-- أيقونة السوشيال -->
        </button>
      </li>
    </ul>

    <button type="button"
            class="floating-action chatbot-action"
            aria-haspopup="dialog"
            aria-controls="chatbotModal"
            aria-expanded="false"
            aria-label="فتح المحادثة مع المساعد الآلي">
      <!-- أيقونة الشات بوت -->
    </button>

  </div>
</div>

<!-- panel السوشيال -->
<div class="social-panel"
     id="socialPanel"
     role="menu"
     aria-hidden="true"
     hidden>
  <!-- روابط حسابات التواصل الاجتماعي -->
  <a href="https://facebook.com/..." role="menuitem" target="_blank" rel="noopener noreferrer">Facebook</a>
  <a href="https://instagram.com/..." role="menuitem" target="_blank" rel="noopener noreferrer">Instagram</a>
  <!-- ... -->
</div>

<!-- مودال الشات بوت -->
<div class="chatbot-modal"
     id="chatbotModal"
     role="dialog"
     aria-modal="true"
     aria-hidden="true"
     hidden>
  <!-- محتوى الشات بوت -->
</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
