<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16140F">
<meta name="color-scheme" content="dark">
<title>الصفحة غير موجودة | Raafat Coaching</title>
<style>
  /* ============================================================
     نفس توكنز التصميم الأساسية من variables.css (مُضمَّنة يدويًا
     هنا عشان الصفحة تشتغل لوحدها بدون أي ملف CSS خارجي)
     ============================================================ */
  :root{
    --color-bg: #16140F;
    --color-surface: #211D17;
    --color-border: #3A362C;
    --color-accent: #FF5A1F;
    --color-accent-hover: #E64F18;
    --color-accent-secondary: #C9FF4F;
    --color-text-primary: #F5F1E8;
    --color-text-secondary: #C7C2B5;
    --color-text-muted: #8C8779;
    --color-text-on-accent: #16140F;
    --shadow-accent-glow: 0 0 40px rgba(255, 90, 31, 0.25);
    --radius-md: 12px;
    --radius-full: 999px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    background: var(--color-bg);
    background-image:
      radial-gradient(circle at 15% 15%, rgba(255, 90, 31, 0.10), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(201, 255, 79, 0.06), transparent 45%);
    color: var(--color-text-primary);
    font-family: "IBM Plex Sans Arabic", "Tahoma", "Segoe UI", system-ui, sans-serif;
    line-height: 1.75;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .wrap{
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .code{
    font-family: "Anton", "Tahoma", sans-serif;
    font-size: clamp(4rem, 18vw, 7rem);
    line-height: 1;
    margin: 0;
    letter-spacing: 0.02em;
    color: var(--color-accent);
    text-shadow: var(--shadow-accent-glow);
  }

  .tape{
    width: 72px;
    height: 3px;
    margin: 22px auto 22px;
    background-image: repeating-linear-gradient(
      90deg,
      var(--color-border) 0 2px,
      transparent 2px 9px
    );
  }

  h1{
    font-size: 22px;
    margin: 0 0 14px;
    color: var(--color-text-primary);
    font-weight: 700;
  }

  p{
    margin: 0 auto 8px;
    color: var(--color-text-secondary);
    font-size: 15.5px;
    max-width: 420px;
  }

  .card{
    margin-top: 30px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 22px;
  }

  .actions{
    display: flex;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn{
    flex: 1 1 200px;
    text-align: center;
    padding: 14px 20px;
    border-radius: var(--radius-full);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .btn:active{ transform: scale(0.97); }

  .btn-primary{
    background: var(--color-accent);
    color: var(--color-text-on-accent);
  }
  .btn-primary:hover{ background: var(--color-accent-hover); }

  .btn-secondary{
    background: transparent;
    color: var(--color-text-primary);
    border-color: var(--color-border);
  }
  .btn-secondary:hover{ background: rgba(255,255,255,0.04); }

  .btn:focus-visible{
    outline: 2px solid var(--color-accent);
    outline-offset: 3px;
  }

  .brand{
    margin-top: 40px;
    font-size: 13px;
    color: var(--color-text-muted);
  }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition: none; }
  }

  @media (max-width: 420px){
    body{ padding: 20px 14px; }
    .actions{ flex-direction: column; }
    .btn{ width: 100%; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <p class="code">404</p>
    <div class="tape" aria-hidden="true"></div>

    <h1>الصفحة اللي بتدور عليها مش موجودة</h1>
    <p>ممكن يكون الرابط اتغيّر أو اتحذف، أو تكون كتبت العنوان غلط.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/">
        الرجوع للصفحة الرئيسية
      </a>
      <a class="btn btn-secondary" href="javascript:void(0)" onclick="goBack()">
        ← الرجوع للصفحة السابقة
      </a>
    </div>

    <p class="brand">Raafat Coaching</p>
  </div>

  <script>
    function goBack(){
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }
  </script>

</body>
</html>
